apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: 5g-congestion-hpa
  namespace: 5g-mlops

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 5g-congestion-api

  minReplicas: 2
  maxReplicas: 5

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
